<footer class="site-footer">
    <nav aria-label="其他">
        {% if site.email %}
        <a href="mailto:{{ site.email }}">邮箱</a>
        {% endif %}
        {% if site.github_username %}
        <a href="https://github.com/{{ site.github_username }}">GitHub</a>
        {% endif %}
        {% if site.twitter_username %}
        <a href="https://twitter.com/{{ site.twitter_username }}">Twitter</a>
        {% endif %}
        {% if site.zhihu_username %}
        <a href="https://www.zhihu.com/people/{{ site.zhihu_username }}">知乎</a>
        {% endif %}
        <a href="{{ site.baseurl }}/feed.xml">订阅</a>
    </nav>
    <p class="copyright">© 2017–{{ site.time | date: "%Y" }} {{ site.copyright_name }}</p>
</footer>
