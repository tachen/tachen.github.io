# google_tracking_id:

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty
encoding: utf-8

plugins:
  - jekyll-feed

feed:
  posts_limit: 20

exclude:
  - less
  - node_modules
  - vendor
  - Gruntfile.js
  - package.json
  - README.md
  - Gemfile
  - Gemfile.lock
  - build_0.bat
  - build_1.bat
  - build_2.bat
  - mail
  - fonts
  - js/jquery.js
  - js/jquery.min.js
  - js/bootstrap.js
  - js/bootstrap.min.js
  - js/clean-blog.js
  - js/clean-blog.min.js
  - css/bootstrap.css
  - css/bootstrap.min.css
  - css/clean-blog.css
  - css/clean-blog.min.css
